name: Feature proposal
description: Propose a focused evaluation-release workflow improvement
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the release-control problem without private data or system details.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Privacy and security effect
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
