name: Bug report
description: Report a reproducible SplitSeal defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private records, keys, seals, or sensitive paths.
  - type: input
    id: version
    attributes:
      label: SplitSeal version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest reproduction using synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
