name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and attach Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build tag-matched distributions and checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_assets.py --tag "$RELEASE_TAG" --output-dir dist
      - name: Attach distributions and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
      - name: Record GitHub release immutability state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable')"
          case "$state" in
            true|false) ;;
            *) echo "GitHub release immutable field is missing or invalid" >&2; exit 1 ;;
          esac
          printf 'GitHub release immutable: %s\n' "$state"
          printf 'GitHub release immutable: `%s`\n' "$state" >> "$GITHUB_STEP_SUMMARY"
