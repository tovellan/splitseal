[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "splitseal"
version = "0.1.0"
description = "Deterministic integrity and release controls for evaluation datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tovellan maintainers" }]
keywords = ["benchmark", "dataset", "evaluation", "integrity", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography==50.0.0",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
parquet = ["pyarrow==25.0.1"]
dev = [
  "build==1.5.0",
  "hypothesis==6.165.10",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[project.scripts]
splitseal = "splitseal.cli:main"

[project.entry-points."splitseal.similarity"]

[project.urls]
Documentation = "https://github.com/tovellan/splitseal#readme"
Issues = "https://github.com/tovellan/splitseal/issues"
Repository = "https://github.com/tovellan/splitseal"

[tool.hatch.build.targets.wheel]
packages = ["src/splitseal"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/benchmarks",
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/scripts",
  "/Makefile",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/GOVERNANCE.md",
  "/ROADMAP.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/CHANGELOG.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S603", "S607"]
"benchmarks/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["splitseal"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=splitseal --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "integration: exercises multiple public interfaces",
  "parquet: requires the optional parquet dependency",
]

[tool.coverage.run]
branch = true
source = ["splitseal"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  '\.\.\.',
]
